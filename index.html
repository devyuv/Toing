<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff5a36">
  <meta name="description" content="TOING — Jharsuguda food discovery and direct restaurant calling.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>TOING — Jharsuguda Food</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">TOING<span>•</span></div>
    <div class="sub">Jharsuguda food, one tap away</div>
  </div>
  <button id="installBtn" class="icon-btn hidden" aria-label="Install app">⇩</button>
</header>

<main>
  <section class="hero">
    <div>
      <p class="eyebrow">JHARSUGUDA</p>
      <h1>Hungry? <span>Just TOING.</span></h1>
      <p>Find a restaurant, check its menu, then call to order directly.</p>
    </div>
  </section>

  <div class="search-wrap">
    <span>⌕</span>
    <input id="search" type="search" placeholder="Search restaurants or food..." autocomplete="off">
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-cat="All">All</button>
    <button class="chip" data-cat="Indian">Indian</button>
    <button class="chip" data-cat="Chinese">Chinese</button>
    <button class="chip" data-cat="Fast Food">Fast Food</button>
    <button class="chip" data-cat="Biryani">Biryani</button>
    <button class="chip" data-cat="Cafe">Cafe</button>
  </div>

  <section>
    <div class="section-head">
      <h2>Restaurants</h2>
      <span id="count"></span>
    </div>
    <div id="restaurants" class="restaurant-grid"></div>
    <div id="empty" class="empty hidden">
      <div>🍽️</div><h3>No matches</h3><p>Try another restaurant, dish, or category.</p>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="home">⌂<span>Home</span></button>
  <button class="nav-item" data-view="favorites">♡<span>Favorites</span></button>
  <a class="nav-item" href="admin.html">⚙<span>Admin</span></a>
</nav>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="sheet">
    <button id="closeModal" class="close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
