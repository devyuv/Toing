<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TOING food delivery logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181d"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb21c"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Food cloche -->
  <path d="M166 183c10-49 47-78 90-78s80 29 90 78H166Z" fill="url(#orange)"/>
  <ellipse cx="256" cy="181" rx="105" ry="11" fill="#ff9b18"/>
  <rect x="247" y="92" width="18" height="18" rx="9" fill="#ff9b18"/>
  <ellipse cx="256" cy="91" rx="25" ry="11" fill="#ffae19"/>

  <!-- Speed marks -->
  <path d="M70 249h44" stroke="#ff9b18" stroke-width="12" stroke-linecap="round"/>
  <path d="M57 273h57" stroke="#ff8b16" stroke-width="12" stroke-linecap="round"/>
  <path d="M72 297h37" stroke="#ff6d27" stroke-width="12" stroke-linecap="round"/>

  <!-- TOING wordmark -->
  <path d="M123 218h96l-7 38h-29l-22 119h-48l22-119h-30Z" fill="#fff"/>
  <!-- location-pin O -->
  <path d="M255 216c-43 0-76 29-76 69 0 28 18 49 48 78l28 27 28-27c30-29 48-50 48-78 0-40-33-69-76-69Zm0 43c17 0 30 11 30 28 0 16-13 29-30 29s-30-13-30-29c0-17 13-28 30-28Z" fill="url(#orange)"/>
  <path d="M337 218h47l-27 157h-47Z" fill="#fff"/>
  <path d="M394 218h43l20 83 14-83h43l-27 157h-42l-20-82-14 82h-44Z" fill="#fff"/>

  <!-- tagline -->
  <text x="256" y="416" text-anchor="middle" fill="#fff"
        font-family="Arial, Helvetica, sans-serif" font-size="28"
        font-weight="800" letter-spacing="5">FOOD DELIVERY</text>
  <rect x="92" y="440" width="50" height="5" rx="2.5" fill="#ff8b16"/>
  <rect x="370" y="440" width="50" height="5" rx="2.5" fill="#ff8b16"/>
  <text x="256" y="448" text-anchor="middle" fill="#ff8b16"
        font-family="Arial, Helvetica, sans-serif" font-size="18"
        font-weight="800" letter-spacing="4">JHARSUGUDA</text>
</svg>